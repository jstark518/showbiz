<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-category="Holidays">
  <title>Halloween</title>
  <desc>A moon, drifting bats and a lit pumpkin. Dark, orange, and the one template here allowed to be silly.</desc>

  <!--
    The darkest template in the set, which is the only time that is the right
    call: everything else dark is dark for contrast, this one is dark because
    the subject is night.

    The pumpkin's glow uses `pulse`, so it flickers like something with a candle
    in it. Bats `drift` on staggered negative delays, so they are already out of
    step when the slide arrives rather than flying in formation for a second.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b0714"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.32">
    <circle data-animate="breathe" cx="1560" cy="230" r="280" fill="#f97316"
            data-paint-field="accent" data-paint="fill" data-paint-label="Accent color"
            data-paint-swatch="#f97316 #fb923c #a855f7 #22c55e #facc15 #ef4444"/>
    <circle data-animate="breathe" data-animate-delay="3" cx="300" cy="900" r="260" fill="#a855f7"/>
  </g>

  <circle data-animate="fade" cx="1560" cy="230" r="150" fill="url(#moon)" opacity="0.92"/>

  <!-- Bats. One shape at a nominal 60 units wide, placed by wrappers. -->
  <g fill="#0b0714" opacity="0.85">
    <g transform="translate(1310 380) scale(2.1)">
      <path data-animate="drift" data-animate-delay="1"
            d="M0-2c-4-6-10-10-18-8-4 1-8 4-12 8 4-2 8-1 10 2 2 3 4 5 7 5 4 0 8-2 10-5l3 4 3-4c2 3 6 5 10 5 3 0 5-2 7-5 2-3 6-4 10-2-4-4-8-7-12-8-8-2-14 2-18 8z"/>
    </g>
    <g transform="translate(1720 470) scale(1.5)">
      <path data-animate="drift" data-animate-delay="4"
            d="M0-2c-4-6-10-10-18-8-4 1-8 4-12 8 4-2 8-1 10 2 2 3 4 5 7 5 4 0 8-2 10-5l3 4 3-4c2 3 6 5 10 5 3 0 5-2 7-5 2-3 6-4 10-2-4-4-8-7-12-8-8-2-14 2-18 8z"/>
    </g>
    <g transform="translate(1480 130) scale(1.2)">
      <path data-animate="drift" data-animate-delay="6"
            d="M0-2c-4-6-10-10-18-8-4 1-8 4-12 8 4-2 8-1 10 2 2 3 4 5 7 5 4 0 8-2 10-5l3 4 3-4c2 3 6 5 10 5 3 0 5-2 7-5 2-3 6-4 10-2-4-4-8-7-12-8-8-2-14 2-18 8z"/>
    </g>
  </g>

  <!-- The pumpkin, bottom right. Three lobes and a stem, lit from inside. -->
  <g transform="translate(1600 830) scale(1.5)">
    <g data-animate="pop" data-animate-delay="3">
      <ellipse cx="0" cy="0" rx="96" ry="80" fill="#f97316" data-paint-field="accent" data-paint="fill"/>
      <ellipse cx="-40" cy="0" rx="40" ry="78" fill="#ea580c" fill-opacity="0.45"/>
      <ellipse cx="40" cy="0" rx="40" ry="78" fill="#ea580c" fill-opacity="0.45"/>
      <path d="M-8-78c0-16 4-26 14-32-4 10-2 20 4 28z" fill="#4d7c0f"/>
      <g data-animate="pulse" fill="#fef08a">
        <path d="M-46-22-16-8-46 2z"/>
        <path d="M46-22 16-8 46 2z"/>
        <path d="M-42 26h84l-14 18h-56z"/>
      </g>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text data-animate="fade" x="150" y="330" font-size="34" font-weight="700" letter-spacing="14" fill="#f97316"
          data-paint-field="accent" data-paint="fill"
          data-field="eyebrow" data-label="Kicker" data-fit="1100">HALLOWEEN</text>

    <!-- Two elements, one field: the panel wraps what you type across both. -->
    <text data-animate="rise" data-animate-delay="1" x="146" y="500" font-size="128" font-weight="700" letter-spacing="-4" fill="#faf5ff"
          data-field="headline" data-label="The headline"
          data-hint="It wraps across two lines." data-fit="1200">Costumes are</text>
    <text data-animate="rise" data-animate-delay="2" x="146" y="628" font-size="128" font-weight="700" letter-spacing="-4" fill="#faf5ff"
          data-field="headline" data-fit="1200">encouraged</text>

    <rect data-animate="sweep" data-animate-delay="3" x="150" y="690" width="220" height="8" rx="4" fill="#f97316"
          data-paint-field="accent" data-paint="fill"/>

    <text data-animate="rise" data-animate-delay="4" x="150" y="800" font-size="46" font-weight="500" fill="#e9d5ff"
          data-field="note" data-label="A line underneath" data-fit="1200">Judging in the kitchen at four, and there is a prize.</text>

    <text data-animate="fade" data-animate-delay="5" x="150" y="900" font-size="34" fill="#c4b5fd"
          data-field="when" data-type="date" data-label="Date" data-part="date"
          data-fit="1200">October 31, 2026</text>
  </g>
</svg>
