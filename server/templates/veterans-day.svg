<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-category="Holidays">
  <title>Veterans Day</title>
  <desc>Service chevrons and stars over navy, thanking everyone who served. Warmer than the Memorial Day panel, and pointed at the living.</desc>

  <!--
    Three patriotic templates is two too many unless each one is unmistakably
    its own day. Memorial Day is remembrance and stays quiet; the Fourth is
    fireworks. This one is thanks, so the motif is service chevrons pointing up
    and the headline is addressed to someone.

    The chevrons are strokes rather than filled shapes so `draw` can run them,
    which reads as stripes being laid down rather than appearing.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b1735"/>
      <stop offset="1" stop-color="#14224d"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="200"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.26">
    <circle data-animate="breathe" cx="1580" cy="540" r="340" fill="#dc2626"
            data-paint-field="accent" data-paint="fill" data-paint-label="Accent color"
            data-paint-swatch="#dc2626 #f8fafc #60a5fa #fbbf24 #f87171 #cbd5e1"/>
  </g>

  <g transform="translate(1560 540)" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path data-animate="draw" pathLength="1" d="M-150 60 0-60 150 60" stroke="#dc2626"
          data-paint-field="accent" data-paint="stroke"/>
    <path data-animate="draw" data-animate-delay="2" pathLength="1" d="M-150 170 0 50 150 170" stroke="#f8fafc" opacity="0.9"/>
    <path data-animate="draw" data-animate-delay="4" pathLength="1" d="M-150 280 0 160 150 280" stroke="#60a5fa" opacity="0.75"/>
  </g>

  <g fill="#e2e8f0" opacity="0.6">
    <g transform="translate(1400 190) scale(1.3)">
      <path data-animate="fade" data-animate-delay="3" d="M0-20 4.7-6.5 19-6.2 7.6 2.5 11.8 16.2 0 8-11.8 16.2-7.6 2.5-19-6.2-4.7-6.5Z"/>
    </g>
    <g transform="translate(1720 240) scale(0.9)">
      <path data-animate="fade" data-animate-delay="5" d="M0-20 4.7-6.5 19-6.2 7.6 2.5 11.8 16.2 0 8-11.8 16.2-7.6 2.5-19-6.2-4.7-6.5Z"/>
    </g>
    <g transform="translate(1620 900) scale(1)">
      <path data-animate="fade" data-animate-delay="6" d="M0-20 4.7-6.5 19-6.2 7.6 2.5 11.8 16.2 0 8-11.8 16.2-7.6 2.5-19-6.2-4.7-6.5Z"/>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text data-animate="fade" x="150" y="330" font-size="34" font-weight="700" letter-spacing="14" fill="#93c5fd"
          data-field="eyebrow" data-label="Kicker" data-fit="1260">VETERANS DAY</text>

    <!-- Two elements, one field: the panel wraps what you type across both. -->
    <text data-animate="rise" data-animate-delay="1" x="146" y="490" font-size="124" font-weight="700" letter-spacing="-3" fill="#f8fafc"
          data-field="headline" data-label="The headline"
          data-hint="It wraps across two lines." data-fit="1260">Thank you to</text>
    <text data-animate="rise" data-animate-delay="2" x="146" y="614" font-size="124" font-weight="700" letter-spacing="-3" fill="#f8fafc"
          data-field="headline" data-fit="1260">everyone who served</text>

    <rect data-animate="sweep" data-animate-delay="3" x="150" y="676" width="200" height="8" rx="4" fill="#dc2626"
          data-paint-field="accent" data-paint="fill"/>

    <text data-animate="rise" data-animate-delay="4" x="150" y="790" font-size="44" font-weight="500" fill="#dbeafe"
          data-field="note" data-label="A line underneath" data-fit="1260">To the veterans on this team — we are glad you are here.</text>

    <text data-animate="fade" data-animate-delay="5" x="150" y="890" font-size="36" fill="#94a3b8"
          data-field="detail" data-label="A quieter line" data-fit="1260">The office is open as usual today.</text>

    <text data-animate="fade" data-animate-delay="6" x="150" y="960" font-size="32" fill="#64748b"
          data-field="when" data-type="date" data-label="Date" data-part="date"
          data-fit="1260">November 11, 2026</text>
  </g>
</svg>
