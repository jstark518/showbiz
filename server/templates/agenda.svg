<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Today's agenda</title>
  <desc>A date over four timed rows. For a day's schedule — talks, deliveries, interviews, anything the room needs to know is coming.</desc>

  <!--
    A light template. The sign's own theme does not reach an image, so this is
    simply artwork drawn on white, and it holds its own on a panel set to
    either theme.

    Times are dark on a tinted chip rather than white on a solid one: the chip
    color is a picker, and white on the yellow end of that palette is
    unreadable at any distance.
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="180"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.16">
    <circle cx="1780" cy="90" r="300" fill="#94a3b8"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="146" y="212" fill="#0f172a" font-size="96" font-weight="700" letter-spacing="-2"
          data-field="headline" data-label="Heading" data-fit="1620">Today's agenda</text>
    <text x="150" y="288" fill="#475569" font-size="40" font-weight="500"
          data-field="when" data-type="date" data-label="Date"
          data-hint="Written out in full under the heading." data-part="date"
          data-fit="1620">November 3, 2026</text>

    <rect x="150" y="332" width="1620" height="3" fill="#cbd5e1"/>

    <g>
      <rect x="150" y="390" width="300" height="112" rx="18" fill="#38bdf8" fill-opacity="0.16"
            stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"
            data-paint-field="accent" data-paint="fill stroke" data-paint-label="Chip color"
            data-paint-swatch="#38bdf8 #4ade80 #facc15 #f87171 #a78bfa #f472b6"/>
      <text x="300" y="464" fill="#0f172a" font-size="46" font-weight="700" text-anchor="middle"
            data-field="time1" data-label="First row · time" data-fit="260">9:30 AM</text>
      <text x="500" y="464" fill="#0f172a" font-size="52" font-weight="600"
            data-field="item1" data-label="First row · what" data-fit="1250">Standup, then the sprint review</text>
    </g>

    <g>
      <rect x="150" y="540" width="300" height="112" rx="18" fill="#38bdf8" fill-opacity="0.16"
            stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"
            data-paint-field="accent" data-paint="fill stroke"/>
      <text x="300" y="614" fill="#0f172a" font-size="46" font-weight="700" text-anchor="middle"
            data-field="time2" data-label="Second row · time" data-fit="260">12:00 PM</text>
      <text x="500" y="614" fill="#0f172a" font-size="52" font-weight="600"
            data-field="item2" data-label="Second row · what" data-fit="1250">Lunch and learn in the kitchen</text>
    </g>

    <g>
      <rect x="150" y="690" width="300" height="112" rx="18" fill="#38bdf8" fill-opacity="0.16"
            stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"
            data-paint-field="accent" data-paint="fill stroke"/>
      <text x="300" y="764" fill="#0f172a" font-size="46" font-weight="700" text-anchor="middle"
            data-field="time3" data-label="Third row · time" data-fit="260">2:30 PM</text>
      <text x="500" y="764" fill="#0f172a" font-size="52" font-weight="600"
            data-field="item3" data-label="Third row · what" data-fit="1250">Fire drill — everyone out, back by 3:00</text>
    </g>

    <g>
      <rect x="150" y="840" width="300" height="112" rx="18" fill="#38bdf8" fill-opacity="0.16"
            stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"
            data-paint-field="accent" data-paint="fill stroke"/>
      <text x="300" y="914" fill="#0f172a" font-size="46" font-weight="700" text-anchor="middle"
            data-field="time4" data-label="Fourth row · time" data-fit="260">5:00 PM</text>
      <text x="500" y="914" fill="#0f172a" font-size="52" font-weight="600"
            data-field="item4" data-label="Fourth row · what"
            data-hint="Leave a row blank to drop it." data-fit="1250">Doors locked</text>
    </g>

    <text x="150" y="1022" fill="#64748b" font-size="32"
          data-field="footnote" data-label="Footnote" data-fit="1620">Ask at reception if anything has moved</text>
  </g>
</svg>
