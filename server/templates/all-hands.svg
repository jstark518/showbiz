<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Event notice</title>
  <desc>A date block beside a headline. For a meeting, a talk or anything with a time and a place.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.45">
    <circle cx="1450" cy="880" r="330" fill="#6366f1"/>
    <circle cx="520" cy="140" r="280" fill="#38bdf8"/>
  </g>

  <!-- date block -->
  <g>
    <rect x="150" y="330" width="420" height="420" rx="36" fill="#f8fafc" fill-opacity="0.06" stroke="#f8fafc" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="150" y="330" width="420" height="96" rx="36" fill="#38bdf8"/>
    <rect x="150" y="390" width="420" height="36" fill="#38bdf8"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="360" y="398" fill="#0b1020" font-size="42" font-weight="700" letter-spacing="10"
            data-field="when" data-type="date" data-label="Date" data-hint="The panel writes the day, date and month from this." data-part="weekday" data-case="upper" data-value="2026-09-18" data-fit="360">THURSDAY</text>
      <text x="360" y="620" fill="#f8fafc" font-size="190" font-weight="700"
            data-field="when" data-part="day" data-fit="360">18</text>
      <text x="360" y="700" fill="#94a3b8" font-size="46" font-weight="600" letter-spacing="6"
            data-field="when" data-part="month" data-case="upper" data-fit="380">SEPTEMBER</text>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="660" y="392" fill="#38bdf8" font-size="32" font-weight="700" letter-spacing="12"
          data-field="eyebrow" data-label="Kicker" data-hint="The small line above the headline." data-fit="1150">EVERYONE IS INVITED</text>

    <!-- Two elements, one field: the panel wraps what you type across both. -->
    <text x="656" y="530" fill="#f8fafc" font-size="132" font-weight="700" letter-spacing="-3"
          data-field="headline" data-label="Headline" data-fit="1150">Quarterly</text>
    <text x="656" y="662" fill="#f8fafc" font-size="132" font-weight="700" letter-spacing="-3"
          data-field="headline" data-fit="1150">all-hands</text>

    <text x="660" y="762" fill="#94a3b8" font-size="44"
          data-field="detail" data-label="Time and place" data-fit="1150">3:00 PM · The Atrium · Coffee from 2:30</text>
    <text x="660" y="828" fill="#94a3b8" font-size="44" opacity="0.75"
          data-field="footnote" data-label="Footnote" data-fit="1150">Streamed for anyone working remotely</text>
  </g>
</svg>
